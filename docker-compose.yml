# Local development stack: PostgreSQL + backend. Copy .env.example to .env first.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: shopscale
      POSTGRES_USER: shopscale
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes: [pgdata:/var/lib/postgresql/data]
    ports: ["5432:5432"]
  api:
    build: .
    depends_on: [db]
    environment:
      DB_URL: jdbc:postgresql://db:5432/shopscale
      DB_USERNAME: shopscale
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      # Local stack only. Production must set APP_ENV=production (the default) and every variable in docs/BILLING.md.
      APP_ENV: ${APP_ENV:-development}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8080}
      PAYSTACK_SECRET_KEY: ${PAYSTACK_SECRET_KEY:-}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:-}
    ports: ["8080:8080"]
volumes:
  pgdata:

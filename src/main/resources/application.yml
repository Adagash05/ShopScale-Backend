spring:
  application:
    name: shopscale-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/shopscale}
    username: ${DB_USERNAME:shopscale}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: non_null
server:
  port: ${PORT:8080}
  forward-headers-strategy: native
management:
  endpoints:
    web:
      exposure:
        include: health
app:
  jwt:
    secret: ${JWT_SECRET}
    access-ttl-seconds: 900
    refresh-ttl-days: 30
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  invitation-ttl-days: 7
  mail:
    from: ${MAIL_FROM:}
  business:
    enabled-types: RETAIL,WHOLESALE,RESTAURANT,CATERING,SMALL_CHOPS,PRODUCTION,LIVESTOCK
  subscription:
    trial-plan: BUSINESS
    trial-days: 14
    grace-days: 3

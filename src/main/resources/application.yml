spring:
  servlet:
    multipart:
      max-file-size: 1MB
      max-request-size: 1MB
  application:
    name: shopscale-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/shopscale}
    username: ${DB_USERNAME:shopscale}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: non_null
  mail:
    # Host, port, username and password come from SPRING_MAIL_* (Resend: smtp.resend.com, 587, "resend", API key).
    # Timeouts stop a slow or unreachable provider from holding a worker thread for minutes.
    # Defaults suit Resend on port 587; the SPRING_MAIL_PROPERTIES_MAIL_SMTP_* variables still override them.
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 10000
          writetimeout: 10000
server:
  port: ${PORT:8080}
  forward-headers-strategy: native
management:
  endpoints:
    web:
      exposure:
        include: health
app:
  # production (default) refuses to start with unsafe or missing settings; use development for local work and tests.
  env: ${APP_ENV:production}
  jwt:
    secret: ${JWT_SECRET}
    access-ttl-seconds: 900
    refresh-ttl-days: 30
  cookie:
    secure: ${COOKIE_SECURE:true}
    same-site: ${COOKIE_SAMESITE:Strict}
    domain: ${COOKIE_DOMAIN:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  public-api-url: ${PUBLIC_API_URL:}
  storefront-url: ${STOREFRONT_URL:}
  paystack:
    secret-key: ${PAYSTACK_SECRET_KEY:}
  encryption-key: ${APP_ENCRYPTION_KEY:}
  invitation-ttl-days: 7
  mail:
    from: ${MAIL_FROM:}
  business:
    enabled-types: RETAIL,WHOLESALE,RESTAURANT,CATERING,SMALL_CHOPS,PRODUCTION,LIVESTOCK
  billing:
    auto-charge-enabled: ${BILLING_AUTO_CHARGE_ENABLED:true}
    retry-delays-hours: ${BILLING_RETRY_DELAYS_HOURS:24,48}
    renewal-poll-ms: 900000
    renewal-batch: 25
  subscription:
    trial-plan: BUSINESS
    trial-days: 14
    grace-days: 3

spring:
  servlet:
    multipart:
      max-file-size: 1MB
      max-request-size: 1MB
  application:
    name: shopscale-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/shopscale}
    username: ${DB_USERNAME:shopscale}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: non_null
  mail:
    # Host, port, username and password come from SPRING_MAIL_* (Resend: smtp.resend.com, 587, "resend", API key).
    # Timeouts stop a slow or unreachable provider from holding a worker thread for minutes.
    # Defaults suit Resend on port 587; the SPRING_MAIL_PROPERTIES_MAIL_SMTP_* variables still override them.
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 10000
          writetimeout: 10000
server:
  port: ${PORT:8080}
  forward-headers-strategy: native
management:
  endpoints:
    web:
      exposure:
        include: health
app:
  # production (default) refuses to start with unsafe or missing settings; use development for local work and tests.
  env: ${APP_ENV:production}
  # V1 product scope: hides the specialised modules (restaurant, catering, branches, ...) from every business. Set V1_SCOPE=false to restore them.
  v1-scope: ${V1_SCOPE:true}
  jwt:
    secret: ${JWT_SECRET}
    access-ttl-seconds: 900
    refresh-ttl-days: 30
  cookie:
    secure: ${COOKIE_SECURE:true}
    same-site: ${COOKIE_SAMESITE:Strict}
    domain: ${COOKIE_DOMAIN:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  public-api-url: ${PUBLIC_API_URL:}
  storefront-url: ${STOREFRONT_URL:}
  paystack:
    secret-key: ${PAYSTACK_SECRET_KEY:}
  encryption-key: ${APP_ENCRYPTION_KEY:}
  invitation-ttl-days: 7
  super-admin:
    # One-time provisioning of the platform owner's account (see docs/SUPER_ADMIN_SETUP.md). Leave both empty after the first start.
    email: ${SHOPSCALE_SUPER_ADMIN_EMAIL:}
    initial-password: ${SHOPSCALE_SUPER_ADMIN_INITIAL_PASSWORD:}
    name: ${SHOPSCALE_SUPER_ADMIN_NAME:Platform Owner}
    session-minutes: ${SHOPSCALE_SUPER_ADMIN_SESSION_MINUTES:30}
  media:
    # AUTO: new images go to Cloudflare R2 when every CLOUDFLARE_R2_* variable below is set. DB: always store in PostgreSQL (use this to roll back).
    mode: ${MEDIA_STORAGE_MODE:AUTO}
    # REDIRECT: /api/public/images/{id} redirects to the public image domain. PROXY: the API streams the image itself.
    serve-mode: ${MEDIA_SERVE_MODE:REDIRECT}
    r2:
      account-id: ${CLOUDFLARE_R2_ACCOUNT_ID:}
      access-key-id: ${CLOUDFLARE_R2_ACCESS_KEY_ID:}
      secret-access-key: ${CLOUDFLARE_R2_SECRET_ACCESS_KEY:}
      bucket-name: ${CLOUDFLARE_R2_BUCKET_NAME:}
      # Optional: defaults to https://<account-id>.r2.cloudflarestorage.com
      endpoint: ${CLOUDFLARE_R2_ENDPOINT:}
      # The public address of the bucket, for example https://img.shopscale.com.ng
      public-base-url: ${CLOUDFLARE_R2_PUBLIC_BASE_URL:}
  partners:
    # Accounts (verified email) allowed to run ShopScale Partners administration. Comma separated.
    admin-emails: ${PLATFORM_ADMIN_EMAILS:}
    # Where referral links point (the public site redirects /register to the app). Defaults to FRONTEND_URL.
    referral-base-url: ${PARTNERS_REFERRAL_BASE_URL:}
  mail:
    from: ${MAIL_FROM:}
  business:
    # V1 sign-up: trading businesses only. Existing businesses of other types keep their data (hidden by app.v1-scope).
    enabled-types: ${ENABLED_BUSINESS_TYPES:RETAIL,WHOLESALE}
  billing:
    auto-charge-enabled: ${BILLING_AUTO_CHARGE_ENABLED:true}
    retry-delays-hours: ${BILLING_RETRY_DELAYS_HOURS:24,48}
    renewal-poll-ms: 900000
    renewal-batch: 25
  subscription:
    trial-plan: BUSINESS
    trial-days: 14
    grace-days: 3
